<text x="60" y="206" font-family="Georgia, 'Playfair Display', serif" font-size="28" fill="#F2EDE2">Design</text>
<text x="60" y="242" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#D8D3CA">Jay designs</text>
<text x="60" y="266" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#D8D3CA">and reviews</text>
<rect x="234.8" y="222" width="19" height="4" fill="#8C5348"/><polygon points="252.8,215 266.8,224 252.8,233" fill="#8C5348"/>

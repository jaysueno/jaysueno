<rect x="505.6" y="128" width="188.8" height="192" fill="#EDE7DC"/><rect x="506.6" y="129" width="186.8" height="190" fill="#001B3B"/>
<text x="525.6" y="166" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#D8D3CA">3</text>
<text x="525.6" y="206" font-family="Georgia, 'Playfair Display', serif" font-size="28" fill="#F2EDE2">Check</text>
<text x="525.6" y="242" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#D8D3CA">A deterministic</text>
<text x="525.6" y="266" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#D8D3CA">gate checks</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
<title id="t">How I build</title>
<desc id="d">Five steps from left to right: Jay designs and reviews, agents write, a deterministic gate checks, a human approves money, messages and health data, and the live object is verified.</desc>
<rect x="0" y="0" width="1200" height="360" fill="#EDE7DC"/><rect x="1" y="1" width="1198" height="358" fill="#001B3B"/>
<text x="40" y="64" font-family="Georgia, 'Playfair Display', serif" font-size="34" fill="#F2EDE2">How I build</text>
<text x="40" y="96" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#D8D3CA">Functions decide and fetch. The model phrases.</text>

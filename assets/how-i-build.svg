<text x="292.8" y="206" font-family="Georgia, 'Playfair Display', serif" font-size="28" fill="#F2EDE2">Write</text>
<text x="292.8" y="242" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#D8D3CA">Agents write</text>
<text x="292.8" y="266" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#D8D3CA">nearly all of it</text>
